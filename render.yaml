services:
  - type: web
    name: aura-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: AURA_DATA_DIR
        value: /var/data
      - key: AURA_SQLITE_PATH
        value: /var/data/aura.db
      - key: AURA_AUTH_DB
        value: /var/data/aura_auth.db
      - key: AURA_AUTH_SECRET
        generateValue: true
      - key: AURA_CORS_ORIGINS
        sync: false
    disk:
      name: aura-data
      mountPath: /var/data
      sizeGB: 10
